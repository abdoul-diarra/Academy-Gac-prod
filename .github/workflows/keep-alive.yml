name: Supabase Keep-Alive

on:
  schedule:
    # Tous les lundis et jeudis à 9h00 UTC
    - cron: '0 9 * * 1,4'
  workflow_dispatch: # permet de lancer le workflow manuellement depuis l'onglet Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase pour éviter la pause
        run: |
          curl -s -X GET \
            "${{ secrets.SUPABASE_URL }}/rest/v1/${{ secrets.SUPABASE_TABLE }}?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"